<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planTitle">
  <title id="planTitle">Illustrative site layout plan</title>
  <defs>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C989"/>
      <stop offset="100%" stop-color="#9C7A34"/>
    </linearGradient>
  </defs>

  <!-- outer boundary -->
  <rect x="60" y="60" width="520" height="520" fill="none" stroke="url(#goldStroke)" stroke-width="1.4" opacity="0.55"/>
  <rect x="80" y="80" width="480" height="480" fill="none" stroke="#C9A15C" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>

  <!-- main road -->
  <rect x="60" y="300" width="520" height="40" fill="#0E2544" opacity="0.55"/>
  <line x1="60" y1="320" x2="580" y2="320" stroke="#E4C989" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.7"/>

  <!-- cross road -->
  <rect x="300" y="60" width="40" height="520" fill="#0E2544" opacity="0.55"/>
  <line x1="320" y1="60" x2="320" y2="580" stroke="#E4C989" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.7"/>

  <!-- plots quadrant 1 -->
  <g stroke="#C9A15C" stroke-width="1" fill="#C9A15C" fill-opacity="0.06">
    <rect x="90" y="90" width="90" height="80"/>
    <rect x="190" y="90" width="100" height="80"/>
    <rect x="90" y="180" width="100" height="110"/>
    <rect x="200" y="180" width="90" height="55"/>
    <rect x="200" y="245" width="90" height="45"/>
  </g>

  <!-- plots quadrant 2 -->
  <g stroke="#C9A15C" stroke-width="1" fill="#C9A15C" fill-opacity="0.06">
    <rect x="350" y="90" width="110" height="60"/>
    <rect x="470" y="90" width="110" height="60"/>
    <rect x="350" y="160" width="70" height="130"/>
    <rect x="430" y="160" width="150" height="60"/>
    <rect x="430" y="230" width="150" height="60"/>
  </g>

  <!-- plots quadrant 3 -->
  <g stroke="#C9A15C" stroke-width="1" fill="#C9A15C" fill-opacity="0.06">
    <rect x="90" y="350" width="100" height="90"/>
    <rect x="90" y="450" width="100" height="130"/>
    <rect x="200" y="350" width="90" height="60"/>
    <rect x="200" y="420" width="90" height="160"/>
  </g>

  <!-- plots quadrant 4 -->
  <g stroke="#C9A15C" stroke-width="1" fill="#C9A15C" fill-opacity="0.06">
    <rect x="350" y="350" width="230" height="70"/>
    <rect x="350" y="430" width="110" height="150"/>
    <rect x="470" y="430" width="110" height="70"/>
    <rect x="470" y="510" width="110" height="70"/>
  </g>

  <!-- highlighted plot -->
  <rect x="200" y="180" width="90" height="55" fill="#E4C989" fill-opacity="0.35" stroke="#E4C989" stroke-width="1.6"/>

  <!-- location pin on highlighted plot -->
  <g transform="translate(245,175)">
    <path d="M0 -34 C 15 -34 26 -23 26 -9 C 26 10 0 34 0 34 C 0 34 -26 10 -26 -9 C -26 -23 -15 -34 0 -34 Z" fill="#0B1F3A" stroke="#E4C989" stroke-width="1.5"/>
    <circle cx="0" cy="-9" r="8" fill="#E4C989"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(520,120)" opacity="0.85">
    <circle r="34" fill="none" stroke="#C9A15C" stroke-width="1"/>
    <line x1="0" y1="-34" x2="0" y2="34" stroke="#C9A15C" stroke-width="1"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#C9A15C" stroke-width="1"/>
    <path d="M0 -34 L6 -8 L0 -14 L-6 -8 Z" fill="#E4C989"/>
    <text x="0" y="-42" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#E4C989" letter-spacing="2">N</text>
  </g>
</svg>
